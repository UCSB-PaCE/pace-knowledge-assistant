name: CI

on:
  pull_request:
    paths:
      - "**/*.py"
      - "conftest.py"
      - "tests/**"
      - "requirements*.txt"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "conftest.py"
      - "tests/**"
      - "requirements*.txt"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt ruff==0.16.10
      - name: Lint (syntax errors, undefined names)
        run: ruff check --select E9,F63,F7,F82 .
      - name: Smoke tests (live-credential guard enforced by conftest.py)
        run: pytest -q
