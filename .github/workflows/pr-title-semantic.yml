name: PR title follows Conventional Commits
on:
  pull_request_target:
    types: [opened, edited, synchronize]
jobs:
  lint:
    permissions:
      pull-requests: write
      statuses: write
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}